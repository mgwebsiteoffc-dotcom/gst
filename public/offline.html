<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Offline · BikriBook</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f8fafc;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #1e293b; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 36px 28px;
          max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 30px rgba(79,70,229,.08); }
  .logo { width: 64px; height: 64px; border-radius: 18px; background: #4f46e5; color: #fff;
          font-size: 36px; font-weight: 800; display: grid; place-items: center; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748b; line-height: 1.6; }
  button { margin-top: 20px; width: 100%; border: 0; border-radius: 12px; padding: 13px;
           background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">B</div>
    <h1>You're offline</h1>
    <p>BikriBook needs an internet connection to sync your bills securely. Please check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
